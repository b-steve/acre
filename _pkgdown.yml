url: https://b-steve.github.io/acre/

destination: docs

template:
  bootstrap: 5
  bslib:
    primary: "#046A38"

home:
  links:
  - text: View on CRAN
    href: "#"
  - text: Report a bug
    href: https://github.com/b-steve/acre/issues

navbar:
  structure:
    left: [intro, tutorials, reference, news]
    right: [github]

  components:
    intro:
      text: Get started
      href: articles/acre.html

    tutorials:
      text: Tutorials
      menu:
      - text: Inhomogeneous density analysis
        href: articles/inhom_density.html
      - text: Multi-session analysis
        href: articles/multi_sess.html
      - text: Simulation
        href: articles/simulation.html
      - text: Placeholder 1
        href: articles/placeholder_1.html
      - text: Placeholder 2
        href: articles/placeholder_2.html

    reference:
      text: Reference
      href: reference/index.html

    news:
      text: Changelog
      href: news/index.html

    github:
      icon: fa-github
      aria-label: GitHub
      href: https://github.com/b-steve/acre

articles:
- title: Getting started
  contents:
  - acre

- title: Articles
  contents:
  - articles/inhom_density
  - articles/multi_sess
  - articles/simulation
  - articles/placeholder_1
  - articles/placeholder_2

reference:
  - title: Data preparation
    desc: Functions for reading, formatting, and preparing acoustic SCR data.
    contents:
      - read.acre
      - create.mask
      - location_density

  - title: Model fitting
    desc: Fit acoustic SCR models and compute core model quantities.
    contents:
      - fit.acre
      - esa

  - title: Model summaries
    desc: Extract fitted values, parameter estimates, uncertainty, and model diagnostics.
    contents:
      - summary.acre
      - coef.acre
      - stdEr
      - stdEr.acre
      - vcov.acre
      - confint.acre
      - logLik.acre
      - AIC.acre
      - predict.acre

  - title: Bootstrap methods
    desc: Bootstrap fitted acre models and summarize bootstrap output.
    contents:
      - boot.acre
      - coef.acreboot
      - stdEr.acreboot
      - vcov.acreboot
      - confint.acreboot
      - predict.acreboot

  - title: Plotting
    desc: Plot acre data, masks, fitted models, and diagnostic outputs.
    contents:
      - plot.acre
      - plot.acre_data

  - title: Simulation
    desc: Simulate acoustic SCR data and run simulation studies.
    contents:
      - sim.capt
      - sim_data
      - sim_study
